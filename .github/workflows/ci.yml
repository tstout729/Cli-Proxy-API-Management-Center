name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  native-usage:
    name: macOS usage app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test native usage app
        working-directory: macos/AIUsage
        run: swift test
      - name: Package and verify app signature
        working-directory: macos/AIUsage
        run: ./scripts/package-app.sh

  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: bun run verify
